name: 🐛 提交游戏Bug
description: 遇到Bug了？请告诉我们，我们会尽快修复。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！
        提交前请先搜索 [已有Issue](https://github.com/weijiaChen0324/WestworldServerBugTracker/issues) 避免重复。

  - type: input
    id: player_name
    attributes:
      label: 👤 你的游戏ID
      placeholder: 例如：Steve
    validations:
      required: true

  - type: dropdown
    id: client_type
    attributes:
      label: 📱 你用的是哪个版本？
      description: 服务器支持Java和基岩版互通，请务必选对
      options:
        - Java版
        - 基岩版（Bedrock）
    validations:
      required: true

  - type: dropdown
    id: is_premium
    attributes:
      label: ✅ 你的账号是正版吗？
      description: 正版/离线状态可能影响部分功能表现，请如实选择
      options:
        - 是，我是正版账号
        - 否，我是离线登录（盗版/非正版）
    validations:
      required: true

  - type: input
    id: client_version
    attributes:
      label: 📌 Java版请填写具体版本号
      description: Java版玩家必填（如 26.2），基岩版玩家请直接留空
      placeholder: 例如：1.20.4（仅Java版需要）
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: 📝 发生了什么？
      description: 用大白话描述你遇到的异常情况
      placeholder: 我在主城点传送牌时，游戏突然卡死掉线了...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 复现步骤
      description: 按什么顺序操作能触发这个Bug？
      placeholder: |
        1. 输入 /spawn 回主城
        2. 右键点击红色传送牌
        3. 选择“资源世界”
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📎 截图或报错红字（选填但非常有用）
      description: 可以把图片直接拖进来，或者粘贴报错文字
      placeholder: 拖拽图片到此区域...
